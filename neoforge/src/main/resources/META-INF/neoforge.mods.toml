modLoader = "javafml"
loaderVersion = "[4,)"
license = "GPL-3.0-or-later"
issueTrackerURL = "https://github.com/ReplayMod/ReplayMod/issues"

[[mods]]
modId = "replaymod"
version = "${version}"
displayName = "Replay Mod"
authors = "CrushedPixel, johni0702"
displayURL = "https://replaymod.com/"
logoFile = "replaymod_logo.png"
description = '''
A Mod which allows you to record, replay and share your Minecraft experience.
Unofficial NeoForge port of the GPL-licensed ReplayMod (fleet build).
'''

[[mixins]]
config = "mixins.jgui.json"
[[mixins]]
config = "mixins.core.replaymod.json"
[[mixins]]
config = "mixins.recording.replaymod.json"
[[mixins]]
config = "mixins.replay.replaymod.json"
[[mixins]]
config = "mixins.render.replaymod.json"
[[mixins]]
config = "mixins.render.blend.replaymod.json"
[[mixins]]
config = "mixins.extras.playeroverview.replaymod.json"
[[mixins]]
config = "mixins.compat.shaders.replaymod.json"
[[mixins]]
config = "mixins.compat.mapwriter.replaymod.json"

[[dependencies.replaymod]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2.71,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.replaymod]]
modId = "minecraft"
type = "required"
versionRange = "[26.1.2,26.2)"
ordering = "NONE"
side = "CLIENT"
